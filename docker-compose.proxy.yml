version: '3.8'

services:
  # Nginx reverse proxy with automatic SSL
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
    environment:
      - DEFAULT_HOST=cheeply.duckdns.org
    networks:
      - proxy-network

  # Let's Encrypt companion for automatic SSL
  letsencrypt:
    image: nginxproxy/acme-companion:latest
    container_name: letsencrypt
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - acme-state:/etc/acme.sh
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy
      - DEFAULT_EMAIL=alex.cybitdevs@gmail.com
    depends_on:
      - nginx-proxy
    networks:
      - proxy-network

  # Your existing frontend (modified to not expose ports externally)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
        - VITE_GOOGLE_MAPS_ID=${VITE_GOOGLE_MAPS_ID}
        - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN}
    container_name: shopping-list-frontend
    restart: unless-stopped
    networks:
      - proxy-network
      - app-network
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=cheeply.duckdns.org
      - LETSENCRYPT_HOST=cheeply.duckdns.org
      - LETSENCRYPT_EMAIL=alex.cybitdevs@gmail.com
      - VIRTUAL_PORT=80
    depends_on:
      - backend
    env_file:
      - .env.production

  # Your existing backend (unchanged)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: shopping-list-backend
    restart: unless-stopped
    networks:
      - app-network
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - ZENSERP_API_KEY=${ZENSERP_API_KEY:-}
      - ENABLE_PLAYWRIGHT=false
      - ENABLE_AI_EXTRACTION=false
      - USE_GOOGLE_SEARCH=false
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - CORS_ORIGIN=https://cheeply.duckdns.org
    volumes:
      - ./:/app
      - /app/node_modules

networks:
  proxy-network:
    driver: bridge
  app-network:
    driver: bridge

volumes:
  nginx-certs:
  nginx-vhost:
  nginx-html:
  acme-state:
